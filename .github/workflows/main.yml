name: Main Checks

on:
  workflow_dispatch:

jobs:
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [17.x, 6.x, 8.x, 10.x, 12.x, 14.x]
    env:
      NODE_OPTIONS: ${{ matrix.node-version == '17.x' && '--openssl-legacy-provider' || '' }}
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Pin npm registry to release date
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2022-03-30T00:12:21.829000Z
    - run: npm install
    - name: Run test with Node.js ${{ matrix.node-version }}
      run: npm run test-node
    - name: Build dist bundles and pack tarball
      if: matrix.node-version == '14.x'
      run: |
        npm run build
        npm pack
    - name: Upload npm tarball
      if: matrix.node-version == '14.x'
      uses: actions/upload-artifact@v4
      with:
        name: npm-tarball
        path: node-forge-1.3.1.tgz
        if-no-files-found: error
  test-karma:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [14.x]
        bundler: [webpack, browserify]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Pin npm registry to release date
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2022-03-30T00:12:21.829000Z
    - run: npm install
    - name: Run karma tests
      run: npm run test-karma
      env:
        BUNDLER: ${{ matrix.bundler }}
